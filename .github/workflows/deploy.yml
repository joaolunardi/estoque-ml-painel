name: Publicar painel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "firestore.rules"
      - "firebase.json"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Credencial do Firebase
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Publicar
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@13 deploy --only hosting,firestore:rules --project estoque-ml-7254e --non-interactive
