name: Atualizar estoque

on:
  schedule:
    - cron: "7 * * * *"   # a cada hora (UTC). Em repositório PRIVADO use "7 */3 * * *" (a cada 3h)
  workflow_dispatch:       # botão "Atualizar agora" do app

concurrency:
  group: atualizar-estoque
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job/requirements.txt
      - run: pip install -r job/requirements.txt
      - run: python job/pipeline.py
        env:
          ML_APP_ID: ${{ secrets.ML_APP_ID }}
          ML_SECRET_KEY: ${{ secrets.ML_SECRET_KEY }}
          ML_USER_ID: ${{ secrets.ML_USER_ID }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          TINY_TOKEN: ${{ secrets.TINY_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
